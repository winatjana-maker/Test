<title>Homestead Clearing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
  /* Layout: one full-bleed canvas world, cash + carried chips top-left, test button top-right, tip under the chips. Single-look game palette by choice. */
  :root {
    --ground: #7fae5a;
    --ground-dark: #6f9d4c;
    --edge: #4f7a36;
    --ink: #2b2a22;
    --paper: #fffaf0;
    --cash: #3f9d4f;
    --font-ui: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--edge);
    color: var(--ink);
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: var(--font-ui);
  }
  canvas { display: block; width: 100%; height: 100%; }
  #game { position: relative; }
  .hud {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: 16px;
    right: 120px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    pointer-events: none;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--paper);
    border-radius: 12px;
    padding: 5px 12px 5px 8px;
    font-size: 16px;
    font-weight: 600;
    box-shadow: 0 3px 0 rgba(0,0,0,.18);
    font-variant-numeric: tabular-nums;
    transition: transform .12s;
  }
  .chip.cash { color: var(--cash); }
  .event-banner {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    color: #8a5a10; pointer-events: none; white-space: nowrap;
  }
  .chip.pop { transform: scale(1.12); }
  .chip svg { width: 20px; height: 20px; flex: none; }
  .test-cash {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: 16px;
    font: 600 14px var(--font-ui);
    color: var(--paper);
    background: var(--cash);
    border: 2px dashed var(--paper);
    border-radius: 12px;
    padding: 6px 10px;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.18);
  }
  .test-cash:active { transform: translateY(2px); box-shadow: none; }
  .test-cash:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .hint {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: rgba(43,42,34,.72);
    color: var(--paper);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    max-width: calc(100% - 200px);
    text-align: center;
    pointer-events: none;
    transition: opacity .6s;
  }
  /* map picker: a button bottom-right, and a full-screen chooser */
  .maps-btn {
    position: fixed; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    font: 600 15px var(--font-ui); color: var(--ink); background: var(--paper);
    border: 0; border-radius: 12px; padding: 8px 14px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.18);
  }
  .maps-btn:active { transform: translateY(2px); box-shadow: none; }
  .maps-btn:focus-visible, .map-opt:focus-visible, .picker-close:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .picker { position: fixed; inset: 0; background: rgba(43,42,34,.55); display: grid; place-items: center; padding: 16px; z-index: 5; }
  .picker-card {
    background: var(--paper); border-radius: 18px; box-shadow: 0 6px 0 rgba(0,0,0,.2); padding: 16px;
    width: 100%; max-width: 440px; max-height: calc(100vh - 32px); overflow-y: auto;
  }
  .picker-card h2 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  .picker-card > p { margin: 0 0 12px; font-size: 14px; color: #5a5446; text-wrap: pretty; }
  #picker-list { display: grid; gap: 8px; }
  .map-opt {
    display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: center; width: 100%; text-align: left;
    font: inherit; color: inherit; background: #f3ead6; border: 2px solid transparent; border-radius: 14px; padding: 10px; cursor: pointer;
  }
  .map-opt.here { border-color: var(--cash); background: #eaf3df; }
  .map-opt .sw { display: block; width: 46px; height: 46px; border-radius: 10px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.15); }
  .map-opt .mo { display: grid; gap: 2px; }
  .map-opt b { font-size: 16px; font-weight: 600; }
  .map-opt .mo span { font-size: 13px; color: #5a5446; line-height: 1.3; }
  .map-opt em { font-style: normal; font-weight: 600; color: var(--cash); }
  .picker-close {
    margin-top: 12px; width: 100%; font: 600 15px var(--font-ui); background: var(--ink); color: var(--paper);
    border: 0; border-radius: 12px; padding: 11px; cursor: pointer;
  }
  /* mini map, under the test button */
  .map {
    position: fixed;
    top: calc(58px + env(safe-area-inset-top, 0px));
    right: 16px;
    width: 110px;
    height: 110px;
    border-radius: 12px;
    border: 2px solid var(--paper);
    box-shadow: 0 3px 0 rgba(0,0,0,.18);
    cursor: pointer;
  }
  .map.big { width: 240px; height: 240px; }
  /* contract + goal card, under the chips */
  .goals {
    position: fixed;
    top: calc(108px + env(safe-area-inset-top, 0px));
    left: 16px;
    right: 140px;
    max-width: 360px;
    background: rgba(43,42,34,.82);
    color: var(--paper);
    border-radius: 12px;
    padding: 8px 10px;
    font-size: 13px;
    line-height: 1.35;
    display: grid;
    gap: 4px;
    pointer-events: none;
  }
  .goals b { color: #fff3a6; font-weight: 600; margin-right: 4px; }
  .goals .rw { color: #a8e6b0; font-weight: 600; }
  .goals .bar { height: 5px; border-radius: 3px; background: rgba(255,250,240,.2); overflow: hidden; }
  .goals .bar i { display: block; height: 100%; background: #7fe08a; }
  /* upgrade panel: opens while you stand on a group tile */
  .panel {
    position: fixed;
    top: calc(108px + env(safe-area-inset-top, 0px));
    left: 16px;
    right: 16px;
    max-width: 420px;
    max-height: calc(52vh - env(safe-area-inset-top, 0px));
    overflow-y: auto;
    background: var(--paper);
    color: var(--ink);
    border-radius: 16px;
    box-shadow: 0 6px 0 rgba(0,0,0,.2);
    padding: 10px 12px 12px;
  }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-bottom: 6px; }
  .panel-head h2 { margin: 0; font-size: 18px; font-weight: 600; text-wrap: balance; }
  .panel-head span { font-size: 12px; color: #7a7466; }
  .up { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #ece3d0; }
  .up-text { flex: 1; min-width: 0; }
  .up-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .up-note { font-size: 13px; color: #6b6558; }
  .up.done .up-name { color: #4f7a36; }
  .dots { display: inline-flex; gap: 3px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #e2d8c3; }
  .dots i.on { background: #3f9d4f; }
  .up button {
    font: 600 15px var(--font-ui);
    color: var(--paper);
    background: var(--cash);
    border: 0;
    border-radius: 10px;
    padding: 8px 12px;
    min-width: 84px;
    box-shadow: 0 3px 0 #2c7238;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .up button:disabled { background: #b9b2a2; box-shadow: 0 3px 0 #9a9384; cursor: default; }
  .up button:not(:disabled):active { transform: translateY(2px); box-shadow: none; }
  .up button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .ctl-sec { border-top: 1px solid #ece3d0; padding: 8px 0; }
  .ctl-sec h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .ctl-sec p { margin: 0 0 6px; font-size: 12px; line-height: 1.35; color: #7a7466; }
  .ctl { padding: 4px 0; }
  .ctl-head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding-bottom: 4px; }
  .ctl-head span { color: #7a7466; font-variant-numeric: tabular-nums; }
  .ctl-head span.warn { color: #c0392b; font-weight: 600; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg + h3 { margin-top: 10px; }
  .seg button { flex: 1; min-width: 44px; font: 600 13px var(--font-ui); color: var(--ink); background: #efe6d3; border: 0; border-radius: 8px; padding: 7px 4px; cursor: pointer; }
  .seg button.on { background: var(--cash); color: var(--paper); box-shadow: 0 2px 0 #2c7238; }
  .seg button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .maxed, .locked { font-size: 13px; font-weight: 600; min-width: 84px; text-align: center; color: #4f7a36; }
  .locked { color: #8a8374; }
  .toast {
    position: fixed;
    left: 50%;
    top: 66%;
    transform: translateX(-50%);
    background: #2b2a22;
    color: #fff3a6;
    font-size: 17px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 14px;
    box-shadow: 0 6px 0 rgba(0,0,0,.25);
    max-width: calc(100% - 32px);
    text-align: center;
    pointer-events: none;
  }
</style>

<canvas id="game"></canvas>
<div class="hud" aria-label="Cash and what you're carrying">
  <div class="chip cash" id="chip-cash" title="Cash">
    <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="1.5" y="5" width="17" height="10" rx="2" fill="#3f9d4f"/><circle cx="10" cy="10" r="2.6" fill="#a8dcae"/></svg>
    <span id="n-cash">$0</span>
  </div>
  <div class="chip cash" id="chip-rate" title="Earned in the last minute">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15 L8 9 L11 12 L17 5" fill="none" stroke="#3f9d4f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 5 H17 V9" fill="none" stroke="#3f9d4f" stroke-width="2.4" stroke-linecap="round"/></svg>
    <span id="n-rate">$0/min</span>
  </div>
  <div class="chip" id="chip-logs" title="Logs carried">
    <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="7" width="16" height="7" rx="3.5" fill="#b5763c"/><ellipse cx="16" cy="10.5" rx="2.6" ry="3.5" fill="#e3b77e"/><circle cx="16" cy="10.5" r="1.2" fill="#b5763c"/></svg>
    <span id="n-logs">0</span>
  </div>
  <div class="chip" id="chip-sap" title="Sap carried">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6 H16 L14.5 17 H5.5 Z" fill="#9aa3ad"/><rect x="4.5" y="7" width="11" height="4" fill="#d79a2b"/><path d="M5 5 Q10 0 15 5" fill="none" stroke="#6b7480" stroke-width="1.4"/></svg>
    <span id="n-sap">0</span>
  </div>
  <div class="chip" id="chip-crops" title="Fruit, corn and eggs carried" hidden>
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9 H17 L15 17 H5 Z" fill="#b5824a"/><circle cx="7.5" cy="7.5" r="3" fill="#d93b30"/><ellipse cx="12.8" cy="7.2" rx="2.6" ry="3.2" fill="#f7efe0" stroke="#c9b48a" stroke-width=".8"/><path d="M3 9 H17" stroke="#7a4f2c" stroke-width="1.6"/></svg>
    <span id="n-crops">0</span>
  </div>
</div>
<button class="test-cash" id="test-cash" type="button" title="Testing only: adds $100">+$100 test</button>
<canvas class="map" id="map" title="Map: tap to make it bigger"></canvas>
<div class="goals" id="goals" hidden></div>
<div class="panel" id="panel" hidden>
  <div class="panel-head"><h2 id="panel-title">Upgrades</h2><span>Step off to close</span></div>
  <div id="panel-list"></div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="chip event-banner" id="chip-event" title="Event on this map" hidden>
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2 L12.4 7.2 L18 7.8 L13.8 11.6 L15 17 L10 14.2 L5 17 L6.2 11.6 L2 7.8 L7.6 7.2 Z" fill="#e8b83a" stroke="#a57a1c" stroke-width="1"/></svg>
    <span id="n-event"></span>
  </div>

<button class="maps-btn" id="maps-btn" type="button">Maps</button>
<div class="picker" id="picker" hidden>
  <div class="picker-card" role="dialog" aria-modal="true" aria-labelledby="picker-title">
    <h2 id="picker-title">Choose your map</h2>
    <p>Each map keeps its own town, cash and upgrades. Switch any time with the Maps button.</p>
    <div id="picker-list"></div>
    <button type="button" class="picker-close" id="picker-close">Close</button>
  </div>
</div>
<div class="hint" id="hint">Touch the bottom left to move · Chop trees · Restock · Grab the cash</div>
