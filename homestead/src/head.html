<title>Homestead Clearing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
  /* Layout: one full-bleed canvas world, cash + carried chips top-left, test button top-right, tip under the chips. Single-look game palette by choice. */
  :root {
    --ground: #7fae5a;
    --ground-dark: #6f9d4c;
    --edge: #4f7a36;
    --ink: #2b2a22;
    --paper: #fffaf0;
    --cash: #3f9d4f;
    --font-ui: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--edge);
    color: var(--ink);
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: var(--font-ui);
  }
  canvas { display: block; width: 100%; height: 100%; }
  .hud {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: 16px;
    right: 120px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    pointer-events: none;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--paper);
    border-radius: 12px;
    padding: 5px 12px 5px 8px;
    font-size: 16px;
    font-weight: 600;
    box-shadow: 0 3px 0 rgba(0,0,0,.18);
    font-variant-numeric: tabular-nums;
    transition: transform .12s;
  }
  .chip.cash { color: var(--cash); }
  .chip.pop { transform: scale(1.12); }
  .chip svg { width: 20px; height: 20px; flex: none; }
  .test-cash {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: 16px;
    font: 600 14px var(--font-ui);
    color: var(--paper);
    background: var(--cash);
    border: 2px dashed var(--paper);
    border-radius: 12px;
    padding: 6px 10px;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.18);
  }
  .test-cash:active { transform: translateY(2px); box-shadow: none; }
  .test-cash:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .hint {
    position: fixed;
    left: 50%;
    top: calc(106px + env(safe-area-inset-top, 0px));
    transform: translateX(-50%);
    background: rgba(43,42,34,.72);
    color: var(--paper);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    max-width: calc(100% - 32px);
    text-align: center;
    pointer-events: none;
    transition: opacity .6s;
  }
</style>

<canvas id="game"></canvas>
<div class="hud" aria-label="Cash and what you're carrying">
  <div class="chip cash" id="chip-cash" title="Cash">
    <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="1.5" y="5" width="17" height="10" rx="2" fill="#3f9d4f"/><circle cx="10" cy="10" r="2.6" fill="#a8dcae"/></svg>
    <span id="n-cash">$0</span>
  </div>
  <div class="chip cash" id="chip-rate" title="Earned in the last minute">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15 L8 9 L11 12 L17 5" fill="none" stroke="#3f9d4f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 5 H17 V9" fill="none" stroke="#3f9d4f" stroke-width="2.4" stroke-linecap="round"/></svg>
    <span id="n-rate">$0/min</span>
  </div>
  <div class="chip" id="chip-logs" title="Logs carried">
    <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="7" width="16" height="7" rx="3.5" fill="#b5763c"/><ellipse cx="16" cy="10.5" rx="2.6" ry="3.5" fill="#e3b77e"/><circle cx="16" cy="10.5" r="1.2" fill="#b5763c"/></svg>
    <span id="n-logs">0</span>
  </div>
  <div class="chip" id="chip-sap" title="Sap carried">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6 H16 L14.5 17 H5.5 Z" fill="#9aa3ad"/><rect x="4.5" y="7" width="11" height="4" fill="#d79a2b"/><path d="M5 5 Q10 0 15 5" fill="none" stroke="#6b7480" stroke-width="1.4"/></svg>
    <span id="n-sap">0</span>
  </div>
</div>
<button class="test-cash" id="test-cash" type="button" title="Testing only: adds $100">+$100 test</button>
<div class="hint" id="hint">Touch the bottom left to move · Chop trees · Restock · Grab the cash</div>
